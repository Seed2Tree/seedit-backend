spring:
  application:
    name: seedit
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seedit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # DB가 아직 없어도 앱이 뜨도록(헬스체크가 DB:DOWN 으로 보고). 운영에선 조정.
      initialization-fail-timeout: -1

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.seedit.feature
  configuration:
    map-underscore-to-camel-case: true   # snake_case 컬럼 -> camelCase 필드 자동 매핑

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:please-change-this-to-a-long-random-secret-key-32bytes+}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  ai:
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
    base-url : ${GMS_BASE_URL:}
  kiwoom:
    base-url: ${KIWOOM_BASE_URL:https://api.kiwoom.com}   # 모의: https://mockapi.kiwoom.com
    app-key: ${KIWOOM_APP_KEY:}
    secret-key: ${KIWOOM_SECRET_KEY:}
  rss:
    feeds:
      - press : 한국경제
        url : ${HK_RSS_FEED_URL:https://www.hankyung.com/feed/all-news}
      - press : 매일경제
        url : ${MK_RSS_FEED_URL:https://www.mk.co.kr/rss/40300001/}
      - press : 서울경제
        url : ${SD_RSS_FEED_URL:https://www.sedaily.com/rss/newsall}
  dart:
    api-key : ${DART_API_KEY}
    base-url : ${DART_BASE_URL:https://opendart.fss.or.kr/api}
  gms:
    key : ${AI_API_KEY}
    model : ${GMS_MODEL:gemini-3.5-flash}
    base-url : ${AI_API_URL:https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta}