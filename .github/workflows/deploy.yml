name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/seedit-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Restart Spring Boot on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f seedit-0.0.1-SNAPSHOT.jar || true
            sleep 3
            source /home/ubuntu/env.sh
            nohup java -jar /home/ubuntu/seedit-0.0.1-SNAPSHOT.jar > /home/ubuntu/app.log 2>&1 &
            disown
            sleep 10
            ps aux | grep seedit
